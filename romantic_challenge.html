<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romantic Challenge</title><style>body{font-family:system-ui;background:#211329;color:white;padding:20px;display:grid;place-items:center;min-height:90vh}main{max-width:480px;background:#38213f;padding:22px;border-radius:20px}select,button{padding:13px;border-radius:12px;margin:6px 0;width:100%;font-size:16px}select{background:#170f20;color:white}.card{background:#170f20;padding:22px;border-radius:15px;margin:15px 0;min-height:120px}.pink{color:#ff9fc5;font-weight:bold}button{background:#ff83b5;border:0;font-weight:bold}.secondary{background:#63476a;color:white}</style></head><body><main><div class="pink">❤️ 100 QUESTIONS · FOR TWO</div><h1>Romantic Challenge</h1><p>Take turns choosing a number. Answer honestly, then press Next. Copy each question into WhatsApp.</p><label>Choose a number</label><select id="pick"></select><div class="card"><div class="pink" id="num"></div><h2 id="q"></h2></div><button class="secondary" id="copy">Copy question</button><button id="next">Next question →</button><p id="status"></p></main><script>
const qs = ["What's your real name and nickname?","What makes you smile instantly?","Are you romantic?","What's your biggest fear?","Who was your first crush?","Do you believe in love at first sight?","What's your favourite thing about yourself?","What makes you jealous?","Have you ever loved someone secretly?","What's your dream date?","What's your biggest turn-on?","Do you prefer calls or texts?","What's the sweetest thing someone has done for you?","Have you ever had a crush on a friend?","What's your biggest relationship red flag?","Would you rather hug or kiss?","What's your idea of a perfect relationship?","Have you ever missed someone but refused to text them?","What's the first thing you notice about a guy?","Describe your dream partner.","Have you ever thought about me romantically?","What's your favourite physical feature?","Would you date your best friend?","What makes someone attractive to you?","Have you ever been heartbroken?","What's one thing you wish people understood about you?","Do you like surprises?","What's your most embarrassing moment?","Would you choose love or money?","What's your biggest secret?","Have you ever wanted to tell someone you like them but couldn't?","What's your favourite romantic song?","Do you prefer a quiet date or an adventurous one?","What's your love language?","Have you ever been jealous because of someone you liked?","What's one thing that can make you fall for someone?","Would you hold hands in public?","What's your sweetest childhood memory?","Have you ever had a dream about someone you like?","What does loyalty mean to you?","What's your first impression of me?","What do you like most about our conversations?","Would you go on a date with me?","What's one thing you find cute about me?","Have you ever smiled because of my message?","Would you rather spend a whole day with me or receive a surprise gift?","What nickname would you give me?","What's one question you've always wanted to ask me?","Do you think we have chemistry?","If I asked you out, what would you say?","Send me three emojis that describe me.","Describe me in three words.","Tell me something you've never told me.","What's the most romantic thing you'd like someone to do for you?","Would you cuddle while watching a movie?","What's your biggest relationship fear?","Have you ever fallen for someone's personality before their looks?","What's one thing you cannot tolerate in a relationship?","Would you rather receive flowers or a handwritten letter?","What's your definition of a perfect kiss?","What makes you feel special?","Have you ever secretly checked someone's status because you missed them?","Would you travel with someone you love?","What's your favourite thing about talking to me?","What would make you stop talking to someone you love?","Do you like being pampered?","What's the most daring thing you've done for love?","Would you choose a romantic dinner or a night walk?","What's one thing you find irresistible?","Can friendship turn into love?","What's one thing you want to experience with someone special?","Have you ever hidden your feelings?","Would you give someone a second chance after heartbreak?","What's your biggest romantic fantasy?","What would you do if someone you secretly liked confessed to you?","What's the best compliment you've ever received?","Do you think I'm your type?","What would our first date look like?","What's something about me you want to know?","If we were together right now, what would we be doing?","What's one thing you want me to promise you?","Would you let me take you on a surprise date?","What is your biggest weakness when it comes to love?","What would make you fall deeply in love?","Have you ever imagined us together?","What would you do if I held your hand?","What's one thing you want us to do together?","Do you think I flirt with you?","What's the sweetest message you wish to receive?","If I called you at midnight, would you answer?","What would you change about our friendship?","Would you be comfortable if I told you I liked you?","What's one thing you want to know about my feelings?","Give me a romantic dare.","Tell me something you like but are afraid to admit.","If we had one day together, how would you spend it?","What's one thing you would never want to lose?","Can you see me becoming more than a friend?","What's your honest opinion of me?","Give me one question you've been afraid to ask me.","What's your final message to me if this game ends with a confession?"];
const pick=document.getElementById('pick');for(let i=1;i<=100;i++){let o=document.createElement('option');o.value=i;o.textContent=i;pick.append(o)}let n=1;function show(x){n=x;pick.value=n;document.getElementById('num').textContent='QUESTION '+n;document.getElementById('q').textContent=qs[n-1];document.getElementById('status').textContent='Question '+n+' of 100'}pick.onchange=()=>show(+pick.value);document.getElementById('next').onclick=()=>show(n===100?1:n+1);document.getElementById('copy').onclick=async()=>{let t=n+'. '+qs[n-1];try{await navigator.clipboard.writeText(t);document.getElementById('status').textContent='Copied! Paste it into WhatsApp.'}catch(e){prompt('Copy this question:',t)}};show(1);
</script></main></body></html>
